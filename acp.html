<!DOCTYPE html>
<html>
    <body>

        <p>Finding the largest number with help of argument objects</p>
        <p id="result"></p>
        <script>
            function findSum()  {
                var i;
               var sum = 0;
               for(i = 0; i < arguments.length; i++) {
                    sum = sum+ arguments[i];
               }
               return sum;
            }
            document.getElementById("result").innerHTML = findSum(4, 5, 6);
        </script>
    </body>
</html>
