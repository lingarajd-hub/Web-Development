<!DOCTYPE html>
<html>
    <head>
        <title>My Superhero Cards</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background: #f0f4ff;
                padding: 30px;
                text-align: center;
            }
            h1 {color: #ff5a43; }
            p {color: #555; }
            .cards {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 25px;
            }
            .card {
                background: white;
                border: 3px solid #ff5a43;
                border-radius: 12px;
                padding: 20px;
                width: 200px;
            }
            .planet-name {
                font-size: 22px;
                font-weight: bold;
                color: #333;
            }
            .planet-fact { color: #666; margin-top: 10px; font-size: 14px; }
            button {
                background: #ff5a43;
                color: white;
                border: none;
                padding: 12px 28px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>My Superhero Cards</h1>
        <p>Use a JavaScript Class to build Superhero cards!</p>
        <button onclick="showPlanets()">Show Superheros!</button>
        <div class="cards">
         <div id="card1"></div>
         <div id="card2"></div>
         <div id="card3"></div>
        </div>
        <script>
            class Superhero {
                constructor(name, fact) {
                    this.name = name;
                    this.fact = fact;
                }
                describe() {
                    return this.name + ": " + this.fact;
                }
            }
            function showSuperheros() {
                let p1 = new Planet("Spiderman", "Can swing with webs");
                let p2 = new Planet("Hulk", "Super Duper Strong!!!");
                let p3 = new Planet("Iron man", "Has lasers");

               document.getElementById("card1").innerHTML =

"<div class='card'><div class='superhero-name'>" + p1.name + "</div>" +

"<div class='superhero-fact'>" + p1.describe() + "</div></div>";

document.getElementById("card2").innerHTML =

"<div class='card'><div class='superhero-name'>" + p2.name + "</div>" +

"<div class='superhero-fact'>" + p2.describe() + "</div></div>";

document.getElementById("card3").innerHTML =

"<div class='card'><div class='superhero-name'>" + p3.name + "</div>" +

"<div class='superhero-fact'>" + p3.describe() + "</div></div>";

            }
        </script>
    </body>
</html>
