<!DOCTYPE html>
<html>
    <head>
        <title>Perimeter Calculator</title>
    </head>
    <body>

        <h1>Perimeter Calculator</h1>
        <button onclick="calculatePerimeter()">Calculate Perimeter</button>

        <script>
            function calculatePerimeter() {
             
                var choice = prompt(
                    "Welcome to Perimeter Calculator.\n" +
                    "Please Enter your Choice.\n" +
                    "1. Perimeter of Rectangle\n" +
                    "2. Perimeter of Square\n" +
                );

                if (choice === "1") {
                    var l = prompt("Enter the Length:");
                    var b = prompt("Enter the Breadth:");

                    var perimeter = 2* (Number(l) + Number(b));
                    alert("Perimeter of Rectangle = " + perimeter);
                }
                 else if (choice === "2") {
                    var b = prompt("Enter the Side:");
                    var perimeter = (Number(b) *4);
                    alert("Perimeter of Square = " + perimeter);
            }
              else {
               alert("Invalid Choice! Please enter 1, or 2."); 
              }
            }
        </script>

    </body>
</html>
